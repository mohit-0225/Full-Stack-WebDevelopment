<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border: 1px solid;
        height: 150px;
        width: 240px;
         
      }
      td{
        height:70px;
        width: 230px;
        
      }
      .orange{
        border-bottom: 2px solid black;
        background-image:linear-gradient(orange);
      }
      .green{
        border-bottom: 2px solid black;
        border-top: 2px solid black;
        background-image:linear-gradient(green);
      }
      .white{
      
        background-image:linear-gradient(white);
      }
      .blue{
        border:2px solid darkblue;
        border-radius:50%;
      }
    </style>
  </head>
  <body>
    <table>
      <tr style="border: 1">
        <td  class="orange" colspan="3"></td>
        
      </tr>
      <tr>
        <td  class="white"> </td>
        <td class="blue"></td>
        <td class="white"> </td>
       
      </tr>
      <tr>
        <td  class="green"colspan="3"></td>
       
      </tr>
    </table>
  </body>
</html>
